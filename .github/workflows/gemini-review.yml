name: Gemini Command-based Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  gemini-review:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/gemini')
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Modern SDKs
        run: |
          pip install google-genai PyGithub

      - name: 🤖 Run Modern Gemini Review
        shell: python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          import os
          import time
          import json
          import re
          from google import genai
          from github import Github, Auth

          def get_diff_and_pr():
              auth = Auth.Token(os.environ['GITHUB_TOKEN'])
              g = Github(auth=auth)
              repo = g.get_repo(os.environ['REPO_NAME'])
              pr = repo.get_pull(int(os.environ['PR_NUMBER']))
              
              diffs = {f.filename: f.patch for f in pr.get_files() 
                       if f.filename.endswith(('.java', '.kt', '.scala')) and f.patch}
              return diffs, pr

          def main():
              try:
                  diffs, pr = get_diff_and_pr()
                  if not diffs:
                      print("ℹ️ No target files to review.")
                      return

                  client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
                  
                  all_comments = []
                  for file_path, patch in diffs.items():
                      print(f"🔍 Analyzing: {file_path}")
                      
                      prompt = f"""
                      당신은 시니어 백엔드 개발자입니다. 다음 diff 내용을 리뷰하고 JSON 배열로만 응답하세요.
                      심각한 보안, 성능, 로직 오류만 지적하세요. (파일: {file_path})
                      
                      형식: [{{"line": 10, "message": "내용", "severity": "HIGH"}}]
                      
                      [diff]
                      {patch}
                      """
                      
                      response = client.models.generate_content(
                          model="gemini-3.1-flash-lite-preview", 
                          contents=prompt
                      )
                      
                      json_match = re.search(r'\[.*\]', response.text, re.DOTALL)
                      if json_match:
                          reviews = json.loads(json_match.group())
                          for rev in reviews:
                              all_comments.append({
                                  "path": file_path,
                                  "line": int(rev['line']),
                                  "body": f"🤖 **[{rev['severity']}]** {rev['message']}",
                                  "side": "RIGHT"
                              })
                      time.sleep(1)

                  if all_comments:
                      commit = pr.get_commits().reversed[0]
                      pr.create_review(commit=commit, body="Gemini Code Review 완료", 
                                       event="COMMENT", comments=all_comments[:15])
                  else:
                      pr.create_issue_comment("✅ 분석 결과, 크리티컬한 이슈는 발견되지 않았습니다.")

              except Exception as e:
                  print(f"💥 Error: {e}")

          if __name__ == "__main__":
              main()