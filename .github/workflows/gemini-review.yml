name: Gemini Command-based Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  gemini-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/gemini')
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          pip install google-generativeai PyGithub

      - name: 🤖 Run Gemini Review Script
        shell: python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          import os
          import time
          import json
          import subprocess
          import google.generativeai as genai
          from github import Github
          import re

          def get_diff():
              g = Github(os.environ['GITHUB_TOKEN'])
              repo = g.get_repo(os.environ['REPO_NAME'])
              pr = repo.get_pull(int(os.environ['PR_NUMBER']))
              
              files = pr.get_files()
              diffs = {}
              for f in files:
                  if f.filename.endswith(('.java', '.kt', '.scala')):
                      diffs[f.filename] = f.patch
              return diffs, pr

          def extract_json(text):
              match = re.search(r'\[\s*\{.*\}\s*\]', text, re.DOTALL)
              if match:
                  return json.loads(match.group())
              return []

          def main():
              try:
                  diffs, pr = get_diff()
                  if not diffs:
                      print("ℹ️ 리뷰할 변경된 파일이 없습니다.")
                      return

                  genai.configure(api_key=os.environ['GEMINI_API_KEY'])
                  model = genai.GenerativeModel('gemini-1.5-flash')
                  
                  all_comments = []
                  commit = pr.get_commits().reversed[0]

                  for file_path, patch in diffs.items():
                      if not patch: continue
                      print(f"🔍 분석 중: {file_path}")

                      prompt = f"""
                      당신은 시니어 백엔드 개발자입니다. 다음 Java/Kotlin 코드의 변경사항(diff)을 리뷰해주세요.
                      
                      [리뷰 가이드]
                      1. 논리적 오류, 성능 이슈(N+1 쿼리 등), 보안 위협을 우선적으로 찾으세요.
                      2. 사소한 컨벤션보다는 코드의 의도와 안정성을 중심으로 리뷰하세요.
                      3. 반드시 아래 JSON 배열 형식으로만 응답하세요.
                      
                      형식:
                      [
                        {{"line": 10, "message": "설명", "severity": "HIGH"}}
                      ]

                      [대상 파일: {file_path}]
                      {patch}
                      """
                      
                      time.sleep(2)
                      response = model.generate_content(prompt)
                      print(f"🤖 Gemini 응답 ({file_path}): {response.text}")

                      try:
                          reviews = extract_json(response.text)
                          for rev in reviews:
                              all_comments.append({
                                  "path": file_path,
                                  "line": int(rev['line']),
                                  "body": f"🤖 **[{rev['severity']}]** {rev['message']}",
                                  "side": "RIGHT"
                              })
                      except Exception as e:
                          print(f"❌ JSON 파싱 실패: {e}")

                  if all_comments:
                      pr.create_review(commit=commit, body="🤖 Gemini AI 코드 리뷰 결과입니다.", 
                                       event="COMMENT", comments=all_comments[:15])
                      print(f"✅ {len(all_comments)}개의 댓글 작성 완료")
                  else:
                      pr.create_issue_comment("✅ Gemini 분석 결과, 이번 변경사항에서 특이사항을 발견하지 못했습니다. (Diff 크기: {}자)".format(sum(len(p) for p in diffs.values() if p)))

              except Exception as e:
                  print(f"💥 치명적 에러: {e}")

          if __name__ == "__main__":
              main()