spring:
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  output:
    ansi:
      enabled: never

server:
  port: 8080
  forward-headers-strategy: native