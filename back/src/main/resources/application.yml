spring:
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  output:
    ansi:
      enabled: always

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  swagger-ui:
    with-credentials: true  # Swagger UI가 쿠키를 포함해서 요청을 보낼 수 있도록 설정

custom:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}  # 소셜 로그인 성공/실패 후 redirect할 프론트엔드 URL
  refresh-token:
    store: redis  # "db" 또는 "redis" — 부하 테스트 비교 시 변경
  jwt:
    secretKey: ${JWT_SECRET}
    accessTokenExpirationSeconds: 1200   # 20분
    refreshTokenExpirationSeconds: 1209600  # 14일